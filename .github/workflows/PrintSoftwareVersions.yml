name: Print Software Versions

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  software_versions:
    name: Check software versions
    runs-on: ubuntu-latest

    steps:
      - name: Set up Flutter and Dart
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Print Flutter version
        run: flutter --version

      - name: Print Dart version
        run: dart --version

  dbms_versions:
    name: Check DBMS versions
    runs-on: ubuntu-latest

    steps:
      - name: Install SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Print SQLite version
        run: sqlite3 --version