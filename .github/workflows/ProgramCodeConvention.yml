name: Program Code Convention

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  dart_code_lint:
    name: Check Dart code conventions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter and Dart
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Print Dart version
        run: dart --version

      - name: Check valid Dart code
        run: dart analyze ProgramCode.dart

      - name: Check modified Dart code
        run: dart analyze ProgramCodeModified.dart
        continue-on-error: true