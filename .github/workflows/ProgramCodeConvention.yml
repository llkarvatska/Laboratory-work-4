name: Program Code Convention

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  python_code_lint:
    name: Check Python code conventions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: pip install ruff

      - name: Check valid Python code
        run: ruff check ProgramCode.py

      - name: Check modified Python code
        run: ruff check ProgramCodeModified.py
        continue-on-error: true
